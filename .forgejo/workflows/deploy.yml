name: Deploy to GitHub

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pyyaml
        run: pip install --quiet pyyaml

      - name: Collect Forgejo stats
        env:
          FORGEJO_URL: https://fed.home.vplan
          FORGEJO_USER: thefed
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: python3 scripts/collect_stats.py

      - name: Commit stats if changed
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions@fed.home.vplan"
          git add data/project_stats.json
          git diff --cached --quiet || git commit -m "chore: update project stats [skip ci]"

      - name: Push to GitHub
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          git remote add github https://x-access-token:${GITHUB_PAT}@github.com/runujhkj/cvportal.git
          git push github main
